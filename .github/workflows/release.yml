name: Build release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    if: github.event.head_commit.message == 'Prepare v1.0.0 release'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build phpBB extension package
        run: |
          mkdir -p build/bennybernaer/accessgateway
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='build' \
            --exclude='dist' \
            ./ build/bennybernaer/accessgateway/
          cd build
          zip -r ../bennybernaer_accessgateway_1.0.0.zip bennybernaer

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.0 \
            bennybernaer_accessgateway_1.0.0.zip \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Access Gateway 1.0.0" \
            --notes-file RELEASE_NOTES_1.0.0.md
